name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Verify optional private Streamer
        run: |
          ASSET="app/src/main/assets/Zaid-Hack-v1.5-Streamer.sh"
          if [ -f "$ASSET" ]; then
            echo "137fe5c326eb79dcf9d687fadfbcef040661d3b92eeef424ec1b628ad5d90ddb  $ASSET" | sha256sum -c -
            grep -qx '__PAYLOAD__' <(grep '^__PAYLOAD__$' "$ASSET")
            echo "AIO asset verified"
          else
            echo "Public build without private Streamer: manual import mode only."
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK artifact
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Package public source patch
        run: |
          zip -q Zaid-Hack-Source-Patch.zip \
            app/src/main/java/com/zaidhack/pink/MainActivity.kt \
            app/src/main/java/com/zaidhack/pink/EmbeddedPayload.kt \
            app/src/main/java/com/zaidhack/pink/SecureLicenseStore.kt \
            app/src/main/java/com/zaidhack/pink/LicenseNotifications.kt \
            app/src/main/java/com/zaidhack/pink/ui/theme/ZaidHackTheme.kt \
            app/src/main/res/drawable/logo_zh.webp \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml \
            app/src/main/res/values/colors.xml \
            app/src/main/AndroidManifest.xml \
            app/build.gradle.kts \
            patches/pink-monet/README.md
      - name: Upload source patch
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Hack-Source-Patch
          path: Zaid-Hack-Source-Patch.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Hack-Android12-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
